services:
  - type: web
    name: cravehub-backend
    runtime: python
    repo: https://github.com/yourusername/cravehub
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT cravehub.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cravehub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cravehub-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cravehub-frontend.onrender.com"

  - type: redis
    name: cravehub-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: cravehub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://cravehub-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cravehub-db
    plan: free
